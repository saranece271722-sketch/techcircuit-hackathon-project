<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Info Controller — Zero-Leak Corporate Governance & AI Brand Compliance</title>
  <meta name="description" content="Next-generation enterprise single-page web application featuring ephemeral time-bound viewing, forensic leak watermarking, and AI visual/semantic verification engine.">
  
  <!-- Favicon Logo Image -->
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B192C',
              blue: '#0066FF',
              darkSurface: '#060D1A',
              lightSurface: '#F4F7FE',
              emerald: '#10B981',
              crimson: '#EF4444'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#060D1A] text-slate-100 min-h-screen antialiased selection:bg-[#0066FF] selection:text-white">
  
  <!-- Root Container for Application State Rendering -->
  <div id="app-root"></div>

  <!-- Core Application Logic -->
  <script src="app.js"></script>
</body>
</html>
